[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rtsilicon"
version = "0.1.0"
description = "GLM-5.2 security-coding harness for open-source silicon red-teaming: scan RTL -> gated Finding -> advisory. The rt-for-silicon sibling of redthread."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "John Kearney" }]
keywords = ["hardware-security", "rtl", "verilog", "puf", "trng", "trojan", "silicon", "red-team"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Private :: Do Not Upload",
]
dependencies = [
    # Same stack as redthread: the driving agent IS the model loop.
    # rtsilicon provides tools + the gated Finding lifecycle + auth boundary.
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "pyyaml>=6.0",
]

[project.scripts]
rt-si = "rtsilicon.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rtsilicon"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
